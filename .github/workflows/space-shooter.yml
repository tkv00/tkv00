name: Space Shooter

on:
  # 하루 한 번(한국 시간 자정) 기여 기록으로 우주 슈팅 게임 GIF를 다시 만듭니다.
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/space-shooter.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # czl9707/gh-space-shooter 액션(v2.0.5)은 생성 직후 저장소에 직접 커밋하려고 해서,
      # 같은 패키지를 CLI로 실행하고 결과 GIF만 따로 올립니다.
      - name: Generate space shooter GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install "gh-space-shooter>=2.0.5,<3"
          mkdir -p dist
          gh-space-shooter "${{ github.repository_owner }}" --output dist/space-shooter.gif --fps 25

      # 1.7MB 안팎의 GIF가 매일 main 기록에 쌓이지 않도록 output 브랜치에 커밋 하나만 남겨 덮어씁니다.
      - name: Push to output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b output
          git add space-shooter.gif
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update space shooter"
          git push --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" output
