name: Space Shooter

on:
  # 하루 한 번(한국 시간 자정) 기여 기록으로 우주 슈팅 게임 GIF를 다시 만듭니다.
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/space-shooter.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare output directory
        run: mkdir -p dist

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: dist/space-shooter.gif
          fps: 25
          no-commit: true

      # 1.7MB 안팎의 GIF가 매일 main 기록에 쌓이지 않도록 output 브랜치에 커밋 하나만 남겨 덮어씁니다.
      - name: Push to output branch
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b output
          git add space-shooter.gif
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update space shooter"
          git push --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" output
