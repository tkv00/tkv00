name: Readme & Commitchi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Update pet from GitHub commits
        env:
          PET_GITHUB_TOKEN: ${{ secrets.PET_GITHUB_TOKEN || github.token }}
          PET_INCLUDE_PRIVATE: ${{ vars.PET_INCLUDE_PRIVATE || 'false' }}
        run: npm run pet:update
      - name: Refresh blog posts
        id: blog
        continue-on-error: true
        run: npm start
      - name: Keep existing posts when RSS is unavailable
        if: steps.blog.outcome == 'failure'
        run: echo 'RSS unavailable. Existing posts are kept; pet can still update.'
      - name: Publish pet and README together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/commitchi.svg pet/data/ledger.json pet/data/state.json
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: care for Commitchi [skip ci]'
            git push origin HEAD:main
          fi
