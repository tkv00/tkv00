name: Readme Update

on:
  push:
    branches: [main]
  # 1시간마다 블로그 RSS를 읽어 README와 블로그 카드 이미지를 갱신합니다.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 정기 실행과 push가 겹쳐도 차례대로 돌아가게 해서 push 충돌을 막습니다.
concurrency:
  group: readme-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update README
        run: npm start

      - name: Commit README
        run: |
          git add README.md assets src/icons
          if git diff --cached --quiet; then
            echo "변경 사항이 없습니다."
            exit 0
          fi
          git config --local user.email "tkv00@naver.com"
          git config --local user.name "tkv00"
          git commit -m "Update README.md"
          git push origin HEAD:main
